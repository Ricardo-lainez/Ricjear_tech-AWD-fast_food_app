services:
  # Backend API
  - type: web
    name: bocatto-valley-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bocatto-valley.vercel.app
    healthCheckPath: /api/health
