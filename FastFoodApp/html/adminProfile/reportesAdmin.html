<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Panel Admin</title>
    <link rel="stylesheet" type="text/css" href="../../styles/stylesAdmin/stylesAdmin.css">

<body>

        <div class="header-left">
            <div class="logo">
                <i class="fas fa-utensils"></i>

            </div>
        </div>
        <div class="header-right">
            <div class="admin-user-info" id="adminUserInfo">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <span class="user-name">Administrador</span>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <div class="admin-container">
        <!-- Sidebar de Navegación -->
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="../AdminProfile.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a href="reportesAdmin.html" class="nav-item active">
                    <i class="fas fa-chart-line"></i>
                    <span>Reportes</span>
                </a>
                <a href="productosAdmin.html" class="nav-item">
                    <i class="fas fa-utensils"></i>
                    <span>Productos</span>
                </a>
                <a href="reservacionesAdmin.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Reservaciones</span>
                </a>
                <a href="pedidosAdmin.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Pedidos</span>
                </a>
                <a href="clientesAdmin.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Clientes</span>
                </a>
                <a href="empleadosAdmin.html" class="nav-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Empleados</span>
                </a>
                <a href="configuracionAdmin.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Configuración</span>
                </a>
                <a href="../../index.html" class="nav-item nav-item-bottom">
                    <i class="fas fa-globe"></i>
                    <span>Ver Sitio Web</span>
                </a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="admin-main">
            <div class="page-header">
                <h1><i class="fas fa-chart-line"></i> Reportes y Estadísticas</h1>
                <p>Analiza el rendimiento de tu restaurante</p>
            </div>

            <div class="content-wrapper">
                <div class="placeholder-content">
                    <i class="fas fa-chart-bar fa-5x"></i>
                    <h2>Sección en Desarrollo</h2>
                    <p>Los reportes y estadísticas estarán disponibles próximamente</p>
                </div>
            </div>
